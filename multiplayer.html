<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>34a MEGAPOWER – Multiplayer</title><style>
:root{font-family:system-ui,Arial;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#16446a,#071226 65%);color:#f0f7ff;min-height:100vh}.wrap{max-width:850px;margin:auto;padding:24px 15px 80px}h1{font-size:clamp(28px,6vw,44px);margin:8px 0;color:#44e8cf}.card{background:#112540;border:1px solid #355a77;border-radius:18px;padding:20px;margin:16px 0}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}button,input{font:inherit;border-radius:12px;padding:13px;min-height:46px}input{background:#09172a;border:1px solid #53708d;color:white;max-width:100%;width:250px}button{border:0;background:#35dfc5;color:#052a31;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.ghost{background:#284663;color:#fff}.muted{color:#afc5d8}.code{font-size:38px;letter-spacing:6px;font-weight:900;color:#ffd76a}.option{display:block;width:100%;text-align:left;margin:9px 0;background:#203e5c;color:white}.option.selected{background:#ffd76a;color:#122437}.score{display:flex;justify-content:space-between;border-bottom:1px solid #35516c;padding:11px 0}.error{color:#ff9c9c}.success{color:#54e4b4}.small{font-size:13px}a{color:#75e3ff}</style></head><body><main class="wrap"><h1>⚡ 34a MEGAPOWER</h1><p>🏆 Echter Online-Multiplayer · 487 §34a-Fragen · 10 Fragen pro Runde</p><div id="app" class="card">Lade Spiel …</div><p class="muted small"><a href="./">← Einzelspieler & Avatar-Shop</a> · Kostenlos · Maximal 12 Spieler pro Raum</p></main><script src="./questions.js"></script><script>
const URL='https://smqeuxsqkmqlpgtbmhre.supabase.co/rest/v1/rpc/',KEY='sb_publishable_-2mJB_-wPHPGbjNJxnkpAg_CKOHbu9J',Q=window.MP_QUESTIONS||[];
const app=document.getElementById('app');const originalName=new URLSearchParams(location.search).get('name')||'';let me=null,st=null,selected=-1,busy=false,err='',lastRound=-2,host=false,finished=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
async function rpc(fn,data){const r=await fetch(URL+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(data)});const txt=await r.text();let obj;try{obj=JSON.parse(txt)}catch{obj=txt}if(!r.ok)throw Error(obj.message||'Verbindung fehlgeschlagen');return obj}
function save(){localStorage.setItem('mp_online_session',JSON.stringify(me))}
function setup(){app.innerHTML='<h2>🎮 Online-Spiel starten</h2><p class="muted">Jeder spielt auf seinem eigenen Gerät. Ein Gastgeber erstellt einen Raum und teilt den Code.</p><p><input id="name" maxlength="24" placeholder="Dein Spielername"></p><div class="row"><button id="create">✨ Raum erstellen</button></div><hr style="border-color:#345"><p><input id="code" maxlength="6" placeholder="6-stelliger Raumcode" style="text-transform:uppercase"></p><button id="join">🚀 Raum beitreten</button><p id="message" class="error"></p>';if(originalName){document.getElementById('name').value=originalName;document.getElementById('name').readOnly=true}document.getElementById('create').onclick=()=>enter('mp_create');document.getElementById('join').onclick=()=>enter('mp_join')}
async function enter(fn){const name=document.getElementById('name').value.trim(),code=document.getElementById('code').value.trim().toUpperCase(),msg=document.getElementById('message');if(!name){msg.textContent='Bitte zuerst deinen Namen eingeben.';return}if(fn==='mp_join'&&code.length!==6){msg.textContent='Bitte den sechsstelligen Raumcode eingeben.';return}msg.textContent='Verbinde …';try{me=await rpc(fn,fn==='mp_create'?{p_name:name}:{p_name:name,p_code:code});host=!!me.host_token;save();await refresh()}catch(e){msg.textContent=e.message}}
async function refresh(){if(!me||busy)return;busy=true;try{const next=await rpc('mp_state',{p_code:me.code,p_token:me.token});if(next.round!==lastRound){selected=-1;lastRound=next.round}st=next;err='';render()}catch(e){err=e.message;render()}finally{busy=false}}
function leaderboard(){return '<h3>🏆 Live-Rangliste</h3>'+st.players.map((p,i)=>'<div class="score"><span>'+(i+1)+'. '+esc(p.name)+(p.answered&&st.status==='playing'?' ✓':'')+'</span><strong>'+p.score+' Punkte</strong></div>').join('')}
function render(){if(!me){setup();return}if(err){app.innerHTML='<p class="error">'+esc(err)+'</p><button id="retry">Erneut versuchen</button>';document.getElementById('retry').onclick=refresh;return}
let h='<p>Raumcode: <span class="code">'+esc(me.code)+'</span></p><p class="muted">Teile den Code mit deinen Freunden. Jeder öffnet denselben Multiplayer-Link.</p>';
if(st.status==='lobby'){h+='<h2>👥 Warteraum</h2>'+leaderboard();if(host)h+='<p><button id="start">▶️ 10 Fragen starten</button></p>';else h+='<p class="muted">Warte, bis der Gastgeber startet.</p>'}
if(st.status==='playing'){const idx=st.questions[st.round],q=Q[idx];h+='<h2>Frage '+(st.round+1)+' von 10</h2>';if(q){h+='<p><strong>'+esc(q.q)+'</strong></p>';h+=q.options.map((o,i)=>'<button class="option '+(selected===i?'selected':'')+'" data-answer="'+i+'" '+(selected>=0?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('');if(selected>=0)h+='<p class="'+(selected===q.correct?'success':'error')+'">'+(selected===q.correct?'✅ Richtig! +100 Punkte':'❌ Nicht richtig. Richtige Antwort: '+esc(q.options[q.correct]))+'</p>'}else h+='<p class="error">Frage konnte nicht geladen werden.</p>';h+=leaderboard();if(host)h+='<p><button id="next">'+(st.round===9?'🏆 Ergebnis anzeigen':'➡️ Nächste Frage')+'</button></p>';else h+='<p class="muted">Der Gastgeber schaltet die nächste Frage frei.</p>'}
if(st.status==='finished')h+='<h2>🎉 Runde beendet!</h2><p>🥇 Gewinner: '+esc(st.players[0]?.name||'')+'</p>'+leaderboard()+'<p><button id="new">Neuen Raum erstellen</button></p>';
app.innerHTML=h;
document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=async()=>{if(selected>=0)return;selected=Number(b.dataset.answer);render();try{await rpc('mp_answer',{p_code:me.code,p_token:me.token,p_round:st.round,p_correct:selected===Q[st.questions[st.round]].correct});await refresh()}catch(e){err=e.message;render()}});
const start=document.getElementById('start');if(start)start.onclick=async()=>{start.disabled=true;try{const ids=Array.from({length:Q.length},(_,i)=>i);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}await rpc('mp_start',{p_code:me.code,p_host_token:me.host_token,p_question_ids:ids.slice(0,10)});await refresh()}catch(e){err=e.message;render()}};
const next=document.getElementById('next');if(next)next.onclick=async()=>{next.disabled=true;try{await rpc('mp_next',{p_code:me.code,p_host_token:me.host_token});await refresh()}catch(e){err=e.message;render()}};
const n=document.getElementById('new');if(n)n.onclick=()=>{me=null;st=null;lastRound=-2;localStorage.removeItem('mp_online_session');setup()};
}
try{me=JSON.parse(localStorage.getItem('mp_online_session')||'null');host=!!me?.host_token}catch{}if(me)refresh();else setup();setInterval(()=>{if(me&&document.visibilityState==='visible')refresh()},2200);
</script></body></html>
