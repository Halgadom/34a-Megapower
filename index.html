,{"topic":"Gewerberecht","q":"Welche Aussage zur IHK-Sachkundeprüfung nach § 34a GewO trifft zu?","options":["Für bestimmte Bewachungstätigkeiten ist sie gesetzlich vorgeschrieben","Sie ist für jede Hilfstätigkeit in jedem Unternehmen verpflichtend","Sie ersetzt die Gewerbeerlaubnis des Unternehmers","Sie verleiht polizeiliche Befugnisse"],"correct":0,"ex":"Die Sachkundeprüfung ist für bestimmte Tätigkeiten erforderlich, etwa Kontrollgänge im öffentlichen Verkehrsraum.","page":0,"difficulty":5,"source":"§34a IHK-orientierte Ergänzung"},{"topic":"Gewerberecht","q":"Was gilt grundsätzlich vor dem Einsatz von Wachpersonen im Bewachungsgewerbe?","options":["Die vorgeschriebenen Voraussetzungen und die Meldung im Bewacherregister sind zu beachten","Ein mündlicher Arbeitsvertrag ersetzt jede Prüfung","Ein privater Dienstausweis genügt immer","Die IHK muss jeden Dienstplan genehmigen"],"correct":0,"ex":"Bewachungsunternehmen müssen die rechtlichen Anforderungen einschließlich der Registerpflichten beachten.","page":0,"difficulty":3,"source":"§34a IHK-orientierte Ergänzung"},{"topic":"Gewerberecht","q":"Welche Aussage über private Sicherheitsmitarbeiter ist richtig?","options":["Sie haben grundsätzlich keine allgemeinen hoheitlichen Polizeibefugnisse","Sie dürfen jede Person ohne Anlass durchsuchen","Sie dürfen jederzeit Ausweise zwangsweise einziehen","Sie dürfen Bußgelder verhängen"],"correct":0,"ex":"Private Sicherheitskräfte handeln vor allem auf Grundlage privater Rechte und gesetzlicher Jedermannrechte.","page":0,"difficulty":4,"source":"§34a IHK-orientierte Ergänzung"},{"topic":"Gewerberecht","q":"Welche Stelle führt die Sachkundeprüfung nach § 34a GewO durch?","options":["Die Industrie- und Handelskammer","Die Polizei","Das Ordnungsamt als Prüfungsstelle","Die Berufsgenossenschaft"],"correct":0,"ex":"Die IHK nimmt die Sachkundeprüfung ab.","page":0,"difficulty":5,"source":"§34a IHK-orientierte Ergänzung"},{"topic":"Datenschutzrecht","q":"Welche Rechtsgrundlage kommt function bossAudio(type){if(!bossSoundEnabled)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;bossAudioCtx=bossAudioCtx||new AC();const c=bossAudioCtx;if(c.state==='suspended')c.resume();const t=c.currentTime;const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type=type==='sword'?'sawtooth':'triangle';f.type='lowpass';f.frequency.setValueAtTime(type==='sword'?3000:900,t);f.frequency.exponentialRampToValueAtTime(type==='sword'?450:120,t+.38);o.frequency.setValueAtTime(type==='sword'?950:190,t);o.frequency.exponentialRampToValueAtTime(type==='sword'?85:42,t+(type==='sword'?.22:.55));g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(type==='sword'?.17:.23,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+(type==='sword'?.3:.62));o.connect(f);f.connect(g);g.connect(c.destination);o.start(t);o.stop(t+(type==='sword'?.32:.65));const len=Math.floor(c.sampleRate*(type==='sword'?.17:.48)),buf=c.createBuffer(1,len,c.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);const noise=c.createBufferSource(),ng=c.createGain(),nf=c.createBiquadFilter();noise.buffer=buf;nf.type=type==='sword'?'highpass':'lowpass';nf.frequency.value=type==='sword'?1700:500;ng.gain.setValueAtTime(type==='sword'?.24:.18,t);ng.gain.exponentialRampToValueAtTime(.0001,t+(type==='sword'?.18:.48));noise.connect(nf);nf.connect(ng);ng.connect(c.destination);noise.start(t)}catch(e){console.warn('Boss sound unavailable',e)}}

 if(s.status==='finished'){const winner=s.players[0]?.name;if(winner===name&&!s.boss_mode){const key='mp_win_'+room.code+'_'+name;if(!localStorage.getItem(key)){localStorage.setItem(key,'1');p.wins=(p.wins||0)+1;save()}}h+=(s.boss_mode?multiplayerBossPanel(s):bossPanel(s));if(s.boss_mode){h+='<h1>'+(s.boss_won?'🏆 DRACHE BESIEGT!':'💀 DRACHE HAT GEWONNEN')+'</h1><p>'+(s.my_boss_reward?'🎁 +1 Drachen-Lootkiste · +50 EP · +25 Bossmünzen · Exklusive Items möglich':'Keine Bossbelohnung')+'</p>'}else{h+='<h1>🏆 SIEGEREHRUNG</h1><h2>🥇 '+esc(winner||'')+'</h2><p>Der Sieger hüpft und hebt die Faust!</p>'}h+=leaderboard()+'<p><button id="return">🌍 Zur gemeinsamen Lobby</button></p>'}
 h+='</div>';if(mpAnswerFeedback&&mpAnswerFeedback.code===room.code&&Date.now()<mpAnswerFeedback.until)h+='<div class="quiz-feedback '+(mpAnswerFeedback.ok?'correct':'incorrect')+'" style="position:fixed;z-index:9999;left:50%;top:20%;transform:translateX(-50%);width:min(90vw,480px);box-shadow:0 12px 45px #0009;pointer-events:none">'+(mpAnswerFeedback.ok?'🟢 RICHTIG!':'🔴 FALSCH!')+'<p>'+esc(mpAnswerFeedback.player)+' hat geantwortet</p></div>';frame(h);dock();wireThemes();wireQuestOptions();$('exit').onclick=leaveQuest;
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=async()=>{if(selected!==-1||!s.my_turn||(s.boss_mode&&s.my_hp<=0))return;const round=s.round,idx=+b.dataset.answer,q=shuffledQuestion(QUESTIONS[s.questions[round]],room.code+':'+round);if(quizCorrects(q).length>1){mpSelected=mpSelected.includes(idx)?mpSelected.filter(x=>x!==idx):[...mpSelected,idx];gameRender();return}await mpSubmitAnswers(q,[idx],round);});if($('mpCheck'))$('mpCheck').onclick=async()=>{if(!mpSelected.length||selected!==-1||!s.my_turn)return;const round=s.round,q=shuffledQuestion(QUESTIONS[s.questions[round]],room.code+':'+round);await mpSubmitAnswers(q,[...mpSelected],round)};async function mpSubmitAnswers(q,answers,round){if(selected!==-1)return;const ok=quizExact(q,answers);selected=answers[0];gameRender();try{const accepted=await rpc(s.boss_mode?'mp_boss_answer':'mp_answer',{p_code:room.code,p_token:room.token,p_round:round,p_correct:ok});if(!accepted){selected=-1;await refresh();return}mpShowFeedback({round,correct:ok,player:name,at:Date.now()/1000});gameRender();cheerAnswer(ok);if(s.boss_mode)bossHitEffect(ok);const key='mp_reward_'+room.code+'_'+round+'_'+name;if(accepted&&!localStorage.getItem(key)){localStorage.setItem(key,'1');p.answered=(p.answered||0)+1;if(ok){p.xp=(p.xp||0)+5;p.coins=(p.coins||0)+10}save()}await new Promise(resolve=>setTimeout(resolve,1800));await refresh()}catch(e){selected=-1;alert(e.message);await refresh()}}
 if($('start'))$('start').onclick=async()=>{try{const n=$('questCount'),d=$('questDifficulty');if(n)questCount=Math.max(10,Math.min(100,Math.round(Number(n.value)||30)));if(d)questDifficulty=d.value;const bb=$('mpBossEnabled');if(bb)mpBossEnabled=bb.value==='yes';let ids=Array.from({length:QUESTIONS.length},(_,i)=>i).filter(i=>topicMatch(QUESTIONS[i],chosenTheme));const range=mpBossEnabled?[8,10]:{leicht:[1,3],mittel:[4,7],schwer:[8,10]}[questDifficulty];if(range)ids=ids.filter(i=>QUESTIONS[i].difficulty>=range[0]&&QUESTIONS[i].difficulty<=range[1]);if(ids.length<questCount){alert('Nur '+ids.length+' passende Fragen vorhanden. Bitte Auswahl ändern.');return}for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}if(questDifficulty==='steigend'){ids.sort((a,b)=>QUESTIONS[a].difficulty-QUESTIONS[b].difficulty);const chosen=[];for(let i=0;i<questCount;i++){let k=Math.floor((i+.5)*ids.length/questCount);while(chosen.includes(ids[k]))k=(k+1)%ids.length;chosen.push(ids[k])}ids=chosen.sort((a,b)=>QUESTIONS[a].difficulty-QUESTIONS[b].difficulty)}await rpc(mpBossEnabled?'mp_boss_start':'mp_start',{p_code:room.code,p_host_token:room.host_token,p_question_ids:ids.slice(0,questCount)});room.boss_mode=mpBossEnabled;await refresh()}catch(e){alert(e.message)}};
 if($('next'))$('next').onclick=async()=>{try{const used=new Set(s.questions||[]);const available=Array.from({length:QUESTIONS.length},(_,i)=>i).filter(i=>!used.has(i));const extra=available.length?available[Math.floor(Math.random()*available.length)]:null;await rpc('mp_next',{p_code:room.code,p_host_token:room.host_token,p_question_id:extra});await refresh()}catch(e){alert(e.message)}};

// Stable option shuffle: all multiplayer clients see the same answer order for each round.
function shuffledQuestion(q,seed){if(!q||!Array.isArray(q.options))return q;const order=q.options.map((_,i)=>i);let h=2166136261;for(const ch of String(seed)){h=Math.imul(h^ch.charCodeAt(0),16777619)>>>0}for(let i=order.length-1;i>0;i--){h=(Math.imul(h,1664525)+1013904223)>>>0;const j=h%(i+1);[order[i],order[j]]=[order[j],order[i]]}const original=Array.isArray(q.correct)?q.correct:[q.correct];return {...q,options:order.map(i=>q.options[i]),correct:Array.isArray(q.correct)?original.map(i=>order.indexOf(i)):order.indexOf(original[0])}}
function quizCorrects(q){return Array.isArray(q.correct)?q.correct:[q.correct]}
function quizAnswerText(q){return quizCorrects(q).map(i=>String.fromCharCode(65+i)+'. '+q.options[i]).join(' · ')}
function quizQuestionText(q){const t=String(q.q||'');return /[A-ZÄÖÜ]/.test(t)&&!/[a-zäöü]/.test(t)?t.toLocaleLowerCase('de-DE').replace(/(^|[.!?]\s+)([a-zäöü])/g,(_,a,b)=>a+b.toLocaleUpperCase('de-DE')).replace(/\b(stgb|bgb|dsgvo|ema|bma|üma|gma|din|vde|bewachv|ihk)\b/gi,x=>x.toLocaleUpperCase('de-DE')):t}
function quizChoices(q,r,attr){const multi=quizCorrects(q).length>1;return (multi?'<p class="gold">☑️ Mehrere Antworten sind richtig. Alle richtigen Antworten auswählen und prüfen.</p>':'')+q.options.map((o,i)=>'<button class="answer" '+attr+'="'+i+'" '+(r.answered?'disabled':'')+(multi&&r.selected?.includes(i)?' style="outline:3px solid #f6cb64;background:#55402d"':'')+'>'+(multi?(r.selected?.includes(i)?'☑ ':'☐ '):'')+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('')+(multi&&!r.answered?'<button id="quizCheck" '+(!r.selected?.length?'disabled':'')+'>✅ Antworten prüfen ('+(r.selected?.length||0)+' gewählt)</button>':'')}
function quizSelect(q,r,index,render,grade){if(r.answered)return;if(quizCorrects(q).length===1){grade([index]);return}r.selected=r.selected||[];r.selected=r.selected.includes(index)?r.selected.filter(i=>i!==index):[...r.selected,index];render()}
function quizWire(q,r,attr,render,grade){document.querySelectorAll('['+attr+']').forEach(b=>b.onclick=()=>quizSelect(q,r,+b.getAttribute(attr),render,grade));const check=$('quizCheck');if(check)check.onclick=()=>{if(r.selected?.length)grade(r.selected)}}
function quizExact(q,selected){const a=quizCorrects(q);return a.length===selected.length&&a.every(i=>selected.includes(i))}
const SOLO_BOSS_LOOT=[{id:'dragon_scale',name:'Drachenschuppe der Ewigkeit',chance:.005},{id:'dragon_crown',name:'Krone des Drachenkönigs',chance:.002},{id:'dragon_egg',name:'Uraltes Drachenei',chance:.0005}];
function soloStart(){stop();screen='solo';let pool=QUESTIONS.map((q,i)=>({q,i})).filter(x=>topicMatch(x.q,chosenTheme));if(soloBossEnabled){pool=pool.filter(x=>Number(x.q.difficulty)>=8);if(!pool.length){screen='soloPick';soloPick();alert('Für dieses Thema sind keine extrem schweren Bossfragen vorhanden. Bitte wähle ein anderes Thema.');return}}const ids=pool.map(x=>x.i);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}const max=Math.min(soloQuestionCount,ids.length);solo={ids:ids.slice(0,max),shuffleSeed:Math.random().toString(36).slice(2),round:0,score:0,answered:false,boss:soloBossEnabled,hp:100,bossHp:Math.ceil(max*.6)*20,bossMaxHp:Math.ceil(max*.6)*20,deadline:Date.now()+soloMinutes*60000,mode:miniMode,errors:0,done:false,won:false};soloRender()}
function soloEnd(s,p){if(s.done)return;s.done=true;s.won=s.boss&&s.bossHp<=0&&s.hp>0;if(s.won){p.xp=(p.xp||0)+50;p.bossCoins=(p.bossCoins||0)+25;p.bossItems=p.bossItems||[];s.drops=[];p.bossWins=(p.bossWins||0)+1;p.dragonChests=(p.dragonChests||0)+1;for(const item of SOLO_BOSS_LOOT)if(Math.random()<item.chance){p.bossItems.push(item.id);s.drops.push(item.name)}save()}soloRender()}

orrect)?'Mehrfachauswahl: Wähle alle richtigen Antworten.':'Einfachauswahl: Wähle genau eine Antwort.')+'</p>'+quizChoices(q,s,'data-solo')+(s.answered?'<div class="quiz-feedback '+(s.correct?'correct':'incorrect')+'">'+(s.correct?'🟢 Volltreffer! +5 EP · +10 Dragon34coins':'🔴 Knapp daneben! Richtig ist: '+esc(quizAnswerText(q)))+'<p class="muted">'+esc(q.ex||'')+'</p>'+'</div><button class="quiz-feedback-next" id="soloNext">'+(s.boss&&s.bossHp<=0?'🏆 Sieg ansehen':s.boss&&s.hp<=0?'💀 Ergebnis':s.round===s.ids.length-1?'Ergebnis':'Nächste Frage')+'</button>':'')+'</div>';frame(h);quizWire(q,s,'data-solo',soloRender,selected=>{if(s.answered)return;s.answered=true;s.correct=quizExact(q,selected);p.answered=(p.answered||0)+1;if(!s.correct)s.errors=(s.errors||0)+1;if(s.correct){p.xp=(p.xp||0)+5;p.coins=(p.coins||0)+10;s.score++;if(s.boss)s.bossHp=Math.max(0,s.bossHp-20)}else if(s.boss){s.hp=Math.max(0,s.hp-25);s.deadline-=10000}save();soloRender();if(s.boss)bossHitEffect(s.correct)});if($('soloNext'))$('soloNext').onclick=()=>{if(s.boss&&(s.bossHp<=0||s.hp<=0)||(s.mode==='ueberleben'&&s.errors>=3)||s.round+1>=s.ids.length){soloEnd(s,p)}else{s.round++;s.answered=false;s.selected=[];soloRender()}}}
