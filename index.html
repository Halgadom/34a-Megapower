function bossAudio(type){if(!bossSoundEnabled)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;bossAudioCtx=bossAudioCtx||new AC();const c=bossAudioCtx;if(c.state==='suspended')c.resume();const t=c.currentTime;const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type=type==='sword'?'sawtooth':'triangle';f.type='lowpass';f.frequency.setValueAtTime(type==='sword'?3000:900,t);f.frequency.exponentialRampToValueAtTime(type==='sword'?450:120,t+.38);o.frequency.setValueAtTime(type==='sword'?950:190,t);o.frequency.exponentialRampToValueAtTime(type==='sword'?85:42,t+(type==='sword'?.22:.55));g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(type==='sword'?.17:.23,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+(type==='sword'?.3:.62));o.connect(f);f.connect(g);g.connect(c.destination);o.start(t);o.stop(t+(type==='sword'?.32:.65));const len=Math.floor(c.sampleRate*(type==='sword'?.17:.48)),buf=c.createBuffer(1,len,c.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);const noise=c.createBufferSource(),ng=c.createGain(),nf=c.createBiquadFilter();noise.buffer=buf;nf.type=type==='sword'?'highpass':'lowpass';nf.frequency.value=type==='sword'?1700:500;ng.gain.setValueAtTime(type==='sword'?.24:.18,t);ng.gain.exponentialRampToValueAtTime(.0001,t+(type==='sword'?.18:.48));noise.connect(nf);nf.connect(ng);ng.connect(c.destination);noise.start(t)}catch(e){console.warn('Boss sound unavailable',e)}}
function bossHitEffect(correct){bossAudio(correct?'sword':'fire');const arena=document.querySelector('.boss-arena');if(!arena)return;arena.classList.remove('boss-hit','boss-burn');void arena.offsetWidth;arena.classList.add(correct?'boss-hit':'boss-burn');const burst=document.createElement('div');burst.className='boss-impact '+(correct?'sword-impact':'fire-impact');burst.textContent=correct?'⚔️ −20':'🔥 −25';arena.appendChild(burst);setTimeout(()=>{burst.remove();arena.classList.remove('boss-hit','boss-burn')},950)}
function cheerAnswer(correct){avatarReaction=correct?'correct':'wrong';showReaction();setTimeout(()=>{avatarReaction=null;document.querySelectorAll('.avatar.reacting').forEach(e=>e.classList.remove('reacting','correct','wrong'))},1600)}
function showReaction(){if(!avatarReaction)return;document.querySelectorAll('.walker').forEach(w=>{const n=w.querySelector('.nametag');if(n&&n.textContent.startsWith(name+' ·')||n&&n.textContent===name){const a=w.querySelector('.avatar');if(a){a.classList.add('reacting',avatarReaction);}}});}
function dock(){const d=$('dock');if(!game||!['playing','finished'].includes(game.status)){d.hidden=true;return}d.hidden=false;const roster=game.players.map(p=>p.name).join('|')+'|'+game.status;if(d.dataset.roster!==roster){d.dataset.roster=roster;d.innerHTML=game.players.map((p,i)=>{const v={...blank(p.name),...(p.avatar||{}),name:p.name},win=game.status==='finished'&&i===0;return '<div class="walker '+(win?'champion':'')+'" style="--speed:'+(7+i%5*1.6)+'s;--delay:-'+i*2.2+'s">'+avatar(v,true,win)+'<div class="nametag">'+esc(p.name)+'</div><div class="points" data-score="'+i+'">⭐ '+p.score+'</div></div>'}).join('')+'<div class="dockfooter">🐉 DRACHENKÖNIGREICH · '+game.players.length+' HELDEN IM EINSATZ</div>'}game.players.forEach((p,i)=>{const el=d.querySelector('[data-score="'+i+'"]');if(el)el.textContent='⭐ '+p.score});showReaction()}
function leaderboard(){return '<div class="grid">'+game.players.map((p,i)=>{const v={...blank(p.name),...(p.avatar||{}),name:p.name};return '<div class="player">'+avatar(v,true)+'<div><strong>'+esc(p.name)+'</strong><div class="gold">🏅 '+(i+1)+'. '+p.score+' Punkte</div><small>'+(p.answered?'✓ Antwort abgegeben':'')+'</small></div></div>'}).join('')+'</div>'}
function bossPanel(s){const completed=s.status==='finished'?s.question_total:s.round;const stage=Math.floor(Math.max(0,completed-1)/10);const count=Math.min(10,s.question_total-stage*10);const hits=Math.max(0,Math.min(count,(s.boss_hits||[]).filter(x=>x>=stage*10&&x<stage*10+count).length));const max=Math.max(1,Math.ceil(count*.6));const hp=Math.max(0,max-hits);return '<div class="boss-arena"><h2>🐉 Drachen-Boss '+(stage+1)+'</h2><span class="boss-dragon">'+(hp?'🐉':'🏆')+'</span><div class="boss-bar"><span style="width:'+(hp/max*100)+'%"></span></div><p>❤️ '+hp+' / '+max+' Lebenspunkte</p><p>'+(hp?'Jede richtige Antwort macht 1 Schaden.':'⚔️ Drache besiegt!')+'</p></div>'}
function multiplayerBossPanel(s){const hp=Math.max(0,Number(s.boss_hp)||0);return '<div class="boss-arena"><span class="boss-dragon">🐉</span><h2>Gemeinsamer Drachen-Boss</h2><div class="boss-bar"><span style="width:'+hp+'%"></span></div><p>🐉 Boss: '+hp+'/100 LP</p><p>❤️ Deine LP: '+s.my_hp+'/100</p><div class="boss-bar"><span style="width:'+Math.max(0,s.my_hp)+'%;background:#55d39a"></span></div><div class="grid">'+s.players.map(p=>'<p>'+esc(p.name)+': '+p.hp+'/100 LP '+(p.hp<=0?'💀':'❤️')+'</p>').join('')+'</div></div>'}
function gameRender(){if(screen!=='game'||!game)return;const s=game,p=profile(name);let h='<div class="panel"><div class="row spread"><span class="tag">● LIVE-MISSION</span><button class="outline tiny" id="exit">← Lobby</button></div><h2>🚨 Security-Quiz · Mission '+esc(room.code)+'</h2>';h+=(room.is_host?'<p class="gold">👑 Du bist Gastgeber</p>':'<p class="muted">👑 Gastgeber: '+esc((s.players.find(x=>x.is_host)||{}).name||'wird bestimmt')+'</p>');if(s.status==='lobby')h+='<h3>👥 Warteraum · '+s.players.length+'/12</h3><p>Warte auf deine Mitspieler. Jeder sieht die gleichen Fragen.</p>'+(room.is_host?themePicker()+questOptions():'<p class="gold">Der Gastgeber wählt das Thema vor dem Start. Bitte warten.</p>')+leaderboard()+(room.is_host?'<p><button id="start">▶ Mission starten</button></p>':'<p class="muted">Der Gastgeber startet die Mission.</p>');
 if(s.status==='playing'){const q=shuffledQuestion(QUESTIONS[s.questions[s.round]],room.code+':'+s.round),correct=q?(Array.isArray(q.correct)?q.correct:[q.correct]):[];h+='<span class="tag">FRAGE '+(s.round+1)+' / '+s.question_total+' · Schwierigkeit '+(Number(q?.difficulty)||1)+'/10'+'</span>';h+=(s.boss_mode?multiplayerBossPanel(s):bossPanel(s));if(q){h+='<p class="gold">🎯 Am Zug: '+esc(s.turn_name||'–')+(s.my_turn?' · DU BIST DRAN!':' · Bitte warten')+'</p><h2>'+esc(q.q)+'</h2>'+q.options.map((o,i)=>'<button class="answer '+(selected===i?'chosen':'')+'" data-answer="'+i+'" '+(selected!==-1||!s.my_turn||(s.boss_mode&&s.my_hp<=0)?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('');if(selected!==-1)h+='<p class="'+(correct.includes(selected)?'gold':'error')+'">'+(selected===-2?'✓ Antwort bereits abgegeben':correct.includes(selected)?'✓ Richtig! +5 EP · +10 Dragon34coins':'✕ Leider falsch')+'</p>'}h+='<h3>🏆 Live-Rangliste</h3>'+leaderboard()+'<p class="muted">Nach der Antwort ist automatisch der nächste Spieler dran.</p>'}
 if(s.status==='finished'){const winner=s.players[0]?.name;if(winner===name&&!s.boss_mode){const key='mp_win_'+room.code+'_'+name;if(!localStorage.getItem(key)){localStorage.setItem(key,'1');p.wins=(p.wins||0)+1;save()}}h+=(s.boss_mode?multiplayerBossPanel(s):bossPanel(s));if(s.boss_mode){h+='<h1>'+(s.boss_won?'🏆 DRACHE BESIEGT!':'💀 DRACHE HAT GEWONNEN')+'</h1><p>'+(s.my_boss_reward?'🎁 +50 EP · +25 Bossmünzen · Exklusive Items möglich':'Keine Bossbelohnung')+'</p>'}else{h+='<h1>🏆 SIEGEREHRUNG</h1><h2>🥇 '+esc(winner||'')+'</h2><p>Der Sieger hüpft und hebt die Faust!</p>'}h+=leaderboard()+'<p><button id="return">🌍 Zur gemeinsamen Lobby</button></p>'}
 h+='</div>';frame(h);dock();wireThemes();wireQuestOptions();$('exit').onclick=leaveQuest;
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=async()=>{if(selected!==-1||!s.my_turn||(s.boss_mode&&s.my_hp<=0))return;const round=s.round,idx=+b.dataset.answer,q=shuffledQuestion(QUESTIONS[s.questions[round]],room.code+':'+round),ok=(Array.isArray(q.correct)?q.correct:[q.correct]).includes(idx);selected=idx;gameRender();try{const accepted=await rpc(s.boss_mode?'mp_boss_answer':'mp_answer',{p_code:room.code,p_token:room.token,p_round:round,p_correct:ok});if(!accepted){selected=-1;await refresh();return}cheerAnswer(ok);if(s.boss_mode)bossHitEffect(ok);const key='mp_reward_'+room.code+'_'+round+'_'+name;if(accepted&&!localStorage.getItem(key)){localStorage.setItem(key,'1');p.answered=(p.answered||0)+1;if(ok){p.xp=(p.xp||0)+5;p.coins=(p.coins||0)+10}save()}await refresh()}catch(e){selected=-1;alert(e.message);await refresh()}});
 if($('start'))$('start').onclick=async()=>{try{const n=$('questCount'),d=$('questDifficulty');if(n)questCount=Math.max(10,Math.min(100,Math.round(Number(n.value)||30)));if(d)questDifficulty=d.value;const bb=$('mpBossEnabled');if(bb)mpBossEnabled=bb.value==='yes';let ids=Array.from({length:QUESTIONS.length},(_,i)=>i).filter(i=>topicMatch(QUESTIONS[i],chosenTheme));const range=mpBossEnabled?[8,10]:{leicht:[1,3],mittel:[4,7],schwer:[8,10]}[questDifficulty];if(range)ids=ids.filter(i=>QUESTIONS[i].difficulty>=range[0]&&QUESTIONS[i].difficulty<=range[1]);if(ids.length<questCount){alert('Nur '+ids.length+' passende Fragen vorhanden. Bitte Auswahl ändern.');return}for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}if(questDifficulty==='steigend'){ids.sort((a,b)=>QUESTIONS[a].difficulty-QUESTIONS[b].difficulty);const chosen=[];for(let i=0;i<questCount;i++){let k=Math.floor((i+.5)*ids.length/questCount);while(chosen.includes(ids[k]))k=(k+1)%ids.length;chosen.push(ids[k])}ids=chosen.sort((a,b)=>QUESTIONS[a].difficulty-QUESTIONS[b].difficulty)}await rpc(mpBossEnabled?'mp_boss_start':'mp_start',{p_code:room.code,p_host_token:room.host_token,p_question_ids:ids.slice(0,questCount)});room.boss_mode=mpBossEnabled;await refresh()}catch(e){alert(e.message)}};
 if($('next'))$('next').onclick=async()=>{try{const used=new Set(s.questions||[]);const available=Array.from({length:QUESTIONS.length},(_,i)=>i).filter(i=>!used.has(i));const extra=available.length?available[Math.floor(Math.random()*available.length)]:null;await rpc('mp_next',{p_code:room.code,p_host_token:room.host_token,p_question_id:extra});await refresh()}catch(e){alert(e.message)}};
 if(s.status==='finished'&&s.boss_mode&&s.my_boss_reward){const key='mp_boss_reward_'+room.code+'_'+name;if(!localStorage.getItem(key)){localStorage.setItem(key,'1');p.xp=(p.xp||0)+50;p.bossCoins=(p.bossCoins||0)+25;p.bossWins=(p.bossWins||0)+1;p.bossItems=(p.bossItems||[]).concat(s.my_boss_loot||[]);save()}}if($('return'))$('return').onclick=leaveQuest;
}
// Stable option shuffle: all multiplayer clients see the same answer order for each round.
function shuffledQuestion(q,seed){if(!q||!Array.isArray(q.options))return q;const order=q.options.map((_,i)=>i);let h=2166136261;for(const ch of String(seed)){h=Math.imul(h^ch.charCodeAt(0),16777619)>>>0}for(let i=order.length-1;i>0;i--){h=(Math.imul(h,1664525)+1013904223)>>>0;const j=h%(i+1);[order[i],order[j]]=[order[j],order[i]]}const original=Array.isArray(q.correct)?q.correct:[q.correct];return {...q,options:order.map(i=>q.options[i]),correct:Array.isArray(q.correct)?original.map(i=>order.indexOf(i)):order.indexOf(original[0])}}
const SOLO_BOSS_LOOT=[{id:'dragon_scale',name:'Drachenschuppe der Ewigkeit',chance:.005},{id:'dragon_crown',name:'Krone des Drachenkönigs',chance:.002},{id:'dragon_egg',name:'Uraltes Drachenei',chance:.0005}];
function soloStart(){stop();screen='solo';let pool=QUESTIONS.map((q,i)=>({q,i})).filter(x=>topicMatch(x.q,chosenTheme));if(soloBossEnabled){pool=pool.filter(x=>Number(x.q.difficulty)>=8);if(!pool.length){screen='soloPick';soloPick();alert('Für dieses Thema sind keine extrem schweren Bossfragen vorhanden. Bitte wähle ein anderes Thema.');return}}const ids=pool.map(x=>x.i);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}const max=Math.min(soloQuestionCount,ids.length);solo={ids:ids.slice(0,max),shuffleSeed:Math.random().toString(36).slice(2),round:0,score:0,answered:false,boss:soloBossEnabled,hp:100,bossHp:100,done:false,won:false};soloRender()}
function soloEnd(s,p){s.done=true;s.won=s.boss&&s.bossHp<=0&&s.hp>0;if(s.won){p.xp=(p.xp||0)+50;p.bossCoins=(p.bossCoins||0)+25;p.bossItems=p.bossItems||[];s.drops=[];p.bossWins=(p.bossWins||0)+1;for(const item of SOLO_BOSS_LOOT)if(Math.random()<item.chance){p.bossItems.push(item.id);s.drops.push(item.name)}save()}soloRender()}
function soloRender(){if(screen!=='solo')return;const s=solo,p=profile(name);if(s.done){const win=s.won;frame('<div class="panel"><h1>'+(win?'🐉 Drachen-Boss besiegt!':s.boss?'💀 Bosskampf gescheitert':'🎉 Übung abgeschlossen!')+'</h1><h2>'+s.score+' richtige Antworten</h2>'+(win?'<p class="gold">🏆 +50 EP · +25 Bossmünzen</p><p>Exklusive Items: '+(s.drops.length?s.drops.map(esc).join(', '):'Diesmal kein seltener Drop')+'</p>':s.boss?'<p>Keine Bossbelohnung.</p>':'')+'<button id="backSolo">🌍 Zur Lobby</button></div>');$('backSolo').onclick=openHub;return}const q=shuffledQuestion(QUESTIONS[s.ids[s.round]],s.shuffleSeed+':'+s.round);if(!q){soloEnd(s,p);return}let h='<div class="panel"><span class="tag">'+(s.boss?'🐉 EXTREMER BOSSKAMPF':'🎯 EINZELSPIELER')+' · FRAGE '+(s.round+1)+'/'+s.ids.length+'</span>';if(s.boss)h+='<div class="boss-arena"><span class="boss-dragon">🐉</span><strong>DRACHEN-BOSS · '+s.bossHp+'/100 LP</strong><div class="boss-bar"><span style="width:'+s.bossHp+'%"></span></div><p>❤️ Deine Lebenspunkte: '+s.hp+'/100</p><div class="boss-bar"><span style="width:'+s.hp+'%;background:#57d3a0"></span></div><p class="muted">Richtig: −20 Boss-LP · Falsch: −25 eigene LP</p></div>';h+='<h2>'+esc(q.q)+'</h2>'+q.options.map((o,i)=>'<button class="answer" data-solo="'+i+'" '+(s.answered?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('')+(s.answered?'<p class="'+(s.correct?'gold':'error')+'">'+(s.correct?'✓ Richtig! +5 EP · +10 Dragon34coins':'✕ Leider falsch · Richtige Antwort: '+esc(q.options[Array.isArray(q.correct)?q.correct[0]:q.correct]))+'</p><button id="soloNext">'+(s.boss&&s.bossHp<=0?'🏆 Sieg ansehen':s.boss&&s.hp<=0?'💀 Ergebnis':s.round===s.ids.length-1?'Ergebnis':'Nächste Frage')+'</button>':'')+'</div>';frame(h);document.querySelectorAll('[data-solo]').forEach(b=>b.onclick=()=>{if(s.answered)return;s.answered=true;s.correct=(Array.isArray(q.correct)?q.correct:[q.correct]).includes(+b.dataset.solo);p.answered=(p.answered||0)+1;if(s.correct){p.xp=(p.xp||0)+5;p.coins=(p.coins||0)+10;s.score++;if(s.boss)s.bossHp=Math.max(0,s.bossHp-20)}else if(s.boss)s.hp=Math.max(0,s.hp-25);save();soloRender();if(s.boss)bossHitEffect(s.correct)});if($('soloNext'))$('soloNext').onclick=()=>{if(s.boss&&(s.bossHp<=0||s.hp<=0)||s.round+1>=s.ids.length){soloEnd(s,p)}else{s.round++;s.answered=false;soloRender()}}}
setupMenu();if(name&&profiles[name]){scheduleTrophySync();openHub()}else create();
